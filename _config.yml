title: MuleSoft Agent Network Quickstart
description: >-
  A step-by-step walkthrough for deploying a first example agent network on
  MuleSoft's Anypoint Platform.
url: https://tbolis-at-mulesoft.github.io
baseurl: /mule-broker-v2-quickstart

remote_theme: just-the-docs/just-the-docs@v0.12.0

plugins:
  - jekyll-remote-theme
  - jekyll-include-cache
  - jekyll-seo-tag
  - jekyll-readme-index
  - jekyll-optional-front-matter
  - jekyll-relative-links
  - jekyll-titles-from-headings

optional_front_matter:
  remove_originals: true

relative_links:
  enabled: true
  collections: false

# The theme expects each page to carry its own H1, so take the nav title from
# that heading without removing it from the page.
titles_from_headings:
  enabled: true
  strip_title: false

# Nav structure lives here rather than in per-page front matter so the
# markdown files stay clean when read on github.com. A new guide needs a
# docs/<guide>/README.md entry with has_children, plus one entry per page
# naming that README's heading as its parent.
defaults:
  - scope:
      path: ""
    values:
      layout: default
  - scope:
      path: README.md
    values:
      nav_exclude: true
  - scope:
      path: docs/quickstart/README.md
    values:
      nav_order: 1
      has_children: true
  - scope:
      path: docs/quickstart/00-prerequisites.md
    values:
      parent: Agent Network Quickstart
      nav_order: 1
  - scope:
      path: docs/quickstart/01-account-setup.md
    values:
      parent: Agent Network Quickstart
      nav_order: 2
  - scope:
      path: docs/quickstart/02-environment-setup.md
    values:
      parent: Agent Network Quickstart
      nav_order: 3
  - scope:
      path: docs/quickstart/03-link-salesforce.md
    values:
      parent: Agent Network Quickstart
      nav_order: 4
  - scope:
      path: docs/quickstart/04-mock-agents-and-mcps.md
    values:
      parent: Agent Network Quickstart
      nav_order: 5
  - scope:
      path: docs/quickstart/05-set-up-agent-network-gateways.md
    values:
      parent: Agent Network Quickstart
      nav_order: 6
  - scope:
      path: docs/quickstart/06-build-agent-network.md
    values:
      parent: Agent Network Quickstart
      nav_order: 7
  - scope:
      path: docs/quickstart/07-publish-agent-network.md
    values:
      parent: Agent Network Quickstart
      nav_order: 8
  - scope:
      path: docs/quickstart/08-deploy-agent-network.md
    values:
      parent: Agent Network Quickstart
      nav_order: 9
  - scope:
      path: docs/quickstart/09-test-agent-network-broker.md
    values:
      parent: Agent Network Quickstart
      nav_order: 10
  - scope:
      path: docs/setup-obo-with-agentforce/README.md
    values:
      nav_order: 2
      has_children: true
  - scope:
      path: docs/setup-obo-with-agentforce/00-overview-and-architecture.md
    values:
      parent: Setup On Behalf Of (OBO) with Agentforce
      nav_order: 1
  - scope:
      path: docs/setup-obo-with-agentforce/01-agentforce-agent.md
    values:
      parent: Setup On Behalf Of (OBO) with Agentforce
      nav_order: 2
  - scope:
      path: docs/setup-obo-with-agentforce/02-keycloak-setup.md
    values:
      parent: Setup On Behalf Of (OBO) with Agentforce
      nav_order: 3
  - scope:
      path: docs/setup-obo-with-agentforce/03-salesforce-token-exchange.md
    values:
      parent: Setup On Behalf Of (OBO) with Agentforce
      nav_order: 4
  - scope:
      path: docs/setup-obo-with-agentforce/04-flex-gateway-obo-policy.md
    values:
      parent: Setup On Behalf Of (OBO) with Agentforce
      nav_order: 5
  - scope:
      path: docs/setup-obo-with-agentforce/05-wire-v2-broker.md
    values:
      parent: Setup On Behalf Of (OBO) with Agentforce
      nav_order: 6
  - scope:
      path: docs/setup-obo-with-agentforce/06-validate.md
    values:
      parent: Setup On Behalf Of (OBO) with Agentforce
      nav_order: 7
  - scope:
      path: examples/README.md
    values:
      nav_order: 3
      has_children: true
  - scope:
      path: examples/it-help-investigation-network/README.md
    values:
      parent: Example Agent Networks
      nav_order: 1
  - scope:
      path: examples/vogue-premiere-network/README.md
    values:
      parent: Example Agent Networks
      nav_order: 2
  - scope:
      path: examples/employee-onboarding-network/README.md
    values:
      parent: Example Agent Networks
      nav_order: 3

search_enabled: true
search:
  heading_level: 2
  previews: 2

# Renders the ```mermaid blocks in the example networks, which github.com
# renders on its own but the theme only loads a library for when pinned here.
mermaid:
  version: 11.17.0

heading_anchors: true
back_to_top: true
back_to_top_text: Back to top

aux_links:
  GitHub repository:
    - https://github.com/tbolis-at-mulesoft/mule-broker-v2-quickstart
aux_links_new_tab: true

exclude:
  - .cursor/
  - .envrc
  - .vscode/
  - it-help-investigation-agent-network/
  - portable-vscode
